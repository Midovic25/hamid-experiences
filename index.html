<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hamid Dehbani Experiences – Expériences authentiques au Maroc</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito+Sans:wght@400;600;700&display=swap">
<!--
  PROTOTYPE POUR DÉVELOPPEUR
  - Toutes les données d'expériences sont dans l'objet JS EXPS (plus bas). Chaque valeur inventée est à remplacer.
  - Le bouton « Mode développeur » (en bas à droite) surligne dans la page chaque contenu fictif avec une note.
  - Les photos sont des fonds dégradés : voir TODO-PHOTO.
  - Marque : le logo reçu dit « Le Maroc Enchanté », le projet « Hamid Dehbani Experiences » : TODO-MARQUE à trancher.
-->
<style>
:root{--bg:#f6eedd;--bg2:#eadcc0;--ink:#3a2a1e;--mute:#6f5a49;--ocre:#a8581e;--sky:#1f4e6b;--palm:#4f6b3a;--card:#fffaf0;--line:#d9c7a4;--gold:#9a7424}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1d1510;--bg2:#2a1f17;--ink:#f1e6d2;--mute:#bba68c;--ocre:#e08a4a;--sky:#7fb4d4;--palm:#9bbd7c;--card:#261c15;--line:#46372b;--gold:#e0b95a}}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Nunito Sans",system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.1;margin:0 0 .5em}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:16px;padding-top:8px;padding-bottom:8px}
header img{height:52px;width:52px;border-radius:50%;object-fit:cover}
header a[aria-label="Accueil"]{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand{font:700 1.3rem/1.1 Fraunces,Georgia,serif;white-space:nowrap}.brand i{color:var(--gold);font-weight:500}
header nav{margin-left:auto;display:flex;gap:18px;align-items:center;font-weight:600}
header nav a{text-decoration:none}
.btn{display:inline-block;background:var(--ocre);color:#fff;border:0;padding:12px 22px;border-radius:999px;font:700 16px "Nunito Sans",sans-serif;text-decoration:none;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.btn.wa{background:#1f7a4d}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
/* photo placeholder */
.photo{position:relative;border-radius:14px;overflow:hidden;min-height:180px;background:linear-gradient(var(--a) 0 52%,var(--b) 52% 100%)}
.photo:before{content:"";position:absolute;width:90px;height:90px;border-radius:50%;background:radial-gradient(#fff6c8,#f7c35a 60%,transparent 62%);left:68%;top:14%}
.photo:after{content:"";position:absolute;left:-10%;right:-10%;bottom:-30%;height:60%;border-radius:50%;background:var(--c)}
.photo small{position:absolute;left:10px;bottom:8px;z-index:2;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:2px 8px;border-radius:6px}
.photo{background-size:cover;background-position:center;transition:background-image .3s}.photo small{opacity:.85}.photo.has:before,.photo.has:after{display:none}
.portrait{width:100%;height:auto;border-radius:18px;display:block}.about{grid-template-columns:1fr 1.5fr;align-items:center}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin:0 0 22px}.act{border-radius:14px;overflow:hidden;background:var(--card);border:1px solid var(--line)}.act .photo{min-height:130px;border-radius:0}.act b{display:block;padding:8px 12px;font-size:15px}
/* hero */
.hero{padding:56px 0 40px;background:linear-gradient(var(--bg2),var(--bg))}
.hero .wrap{display:grid;grid-template-columns:1.05fr 1fr;gap:36px;align-items:center}
.hero h1{font-size:clamp(2.2rem,5vw,3.8rem)}
.hero p{max-width:46ch;color:var(--mute)}
.hero .photo{min-height:360px}
.search{display:flex;flex-wrap:wrap;gap:10px;background:var(--card);border:1px solid var(--line);padding:12px;border-radius:16px;margin-top:22px}
.search select{flex:1 1 140px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
section.block{padding:44px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-decoration:none;display:block}
.card .photo{border-radius:0;min-height:200px}
.card .body{padding:16px 18px 20px}
.card h3{font-size:1.35rem}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--mute);font-size:15px;margin:0 0 10px}
.price{font-weight:700;color:var(--ocre)}
.band{background:var(--sky);color:#fff;padding:34px 0}
.band .wrap{display:flex;flex-wrap:wrap;gap:26px;justify-content:space-between}
.band div{flex:1 1 200px}
.band b{display:block;font-family:Fraunces,serif;font-size:1.2rem}
/* detail */
.dhead{padding:28px 0 8px}
.dhead h1{font-size:clamp(2rem,4.5vw,3.2rem)}
.gal{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:170px 170px;gap:10px}
.gal .photo:first-child{grid-row:span 2}
.gal .photo{min-height:0}
.layout{display:grid;grid-template-columns:1fr 340px;gap:40px;padding:30px 0 50px;align-items:start}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0 28px}
.facts div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.facts span{display:block;color:var(--mute);font-size:14px}
.facts b{font-size:1.05rem}
.atouts{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 24px;padding:0;list-style:none}
.atouts li{border:1px solid var(--palm);color:var(--palm);border-radius:999px;padding:4px 14px;font-weight:600;font-size:15px}
.step{display:grid;grid-template-columns:70px 1fr;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.step time{font-weight:700;color:var(--ocre)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.two ul{padding-left:20px;margin:0}
.book{position:sticky;top:calc(80px + env(safe-area-inset-top,0px));background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.book label{display:block;font-weight:600;font-size:15px;margin:12px 0 4px}
.book input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.book .total{font:700 1.7rem Fraunces,serif;margin:14px 0 4px}
.book .btn{width:100%;text-align:center;margin-top:10px}
.sig{margin-top:30px;background:var(--bg2);border-radius:16px;padding:20px;border-left:6px solid var(--ocre)}
footer{background:var(--ink);color:var(--bg);padding:36px 0 90px}
footer .wrap{display:flex;flex-wrap:wrap;gap:28px;justify-content:space-between}
footer a{display:block;text-decoration:none;margin:4px 0}
footer img{height:70px;border-radius:50%}
/* dev mode */
#devbtn{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:50;background:#222;color:#fff;border:0;border-radius:999px;padding:10px 16px;font:700 14px sans-serif;cursor:pointer}
.dev .ph{outline:2px dashed #e0245e;outline-offset:2px;position:relative;background:rgba(224,36,94,.12)}
.dev .ph:hover:after{content:"À REMPLACER : " attr(data-dev);position:absolute;left:0;top:100%;z-index:60;background:#e0245e;color:#fff;font:600 12px/1.3 sans-serif;padding:5px 8px;border-radius:6px;width:max-content;max-width:260px;pointer-events:none}
@media(max-width:820px){.hero .wrap,.layout,.two{grid-template-columns:1fr}.book{position:static}.gal{grid-template-columns:1fr 1fr;grid-template-rows:200px 120px;grid-auto-rows:120px}.gal .photo:first-child{grid-column:span 2;grid-row:auto}header nav a.hide{display:none}.brand{font-size:1rem;white-space:normal}.about{grid-template-columns:1fr}header img{height:44px;width:44px}}
</style>
</head>

 var u="https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=20&gsrsearch="+encodeURIComponent(q+" filetype:bitmap")+"&prop=imageinfo&iiprop=url|size|extmetadata&iiurlwidth=1200";
 QC[q+minW]=fetch(u).then(function(r){return r.json()}).then(function(d){var out=[];Object.keys((d.query||{}).pages||{}).forEach(function(id){var i=d.query.pages[id].imageinfo&&d.query.pages[id].imageinfo[0];if(!i||i.width<i.height*0.9||i.width<minW)return;var m=i.extmetadata||{},lic=(m.LicenseShortName||{}).value||"";if(!/^(CC|Public|PD)/i.test(lic))return;out.push({u:i.thumburl,c:strip((m.Artist||{}).value)+" – "+lic+" – Wikimedia Commons"})});return out}).catch(function(){return[]});return QC[q+minW]}
